# .github/workflows/comic-factory-v4-test.yml

name: Comic Factory V4 Quality Test

on:
  workflow_dispatch:
    inputs:
      reuse_active:
        description: "Mevcut active event'i tekrar kullan"
        required: false
        default: false
        type: boolean

      ai_reconstruction:
        description: "Eksik görsellerde AI reconstruction kullan"
        required: false
        default: true
        type: boolean

      max_images:
        description: "Global comic görsel havuzu"
        required: false
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: comic-factory-v4-quality-test
  cancel-in-progress: false

jobs:
  build-v4:
    name: Build Comic Factory V4
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Gacrux
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image

      GROQ_WHISPER_MODEL: whisper-large-v3-turbo

      ENABLE_AI_RECONSTRUCTION: "1"
      MAX_AI_RECONSTRUCTIONS: "6"

      # 0 = quality checkpoint geçene kadar repair devam eder.
      QUALITY_GATE_MAX_CYCLES: "0"

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V4 syntax
        run: |
          python -m py_compile comic_factory_v4.py
          echo "✓ comic_factory_v4.py syntax OK"

      - name: Verify runtime
        run: |
          python comic_factory_v4.py --check

      - name: Run Comic Factory V4
        shell: bash
        run: |
          ARGS="--max-images ${{ inputs.max_images }}"

          if [ "${{ inputs.reuse_active }}" = "true" ]; then
            ARGS="$ARGS --reuse-active"
          fi

          if [ "${{ inputs.ai_reconstruction }}" != "true" ]; then
            ARGS="$ARGS --disable-ai-reconstruction"
          fi

          echo "============================================================"
          echo "COMIC FACTORY V4 TEST"
          echo "============================================================"
          echo
          echo "Voice: Gacrux LOCKED"
          echo "Quality repair cycles: UNLIMITED"
          echo "AI reconstruction: ${{ inputs.ai_reconstruction }}"
          echo "Max images: ${{ inputs.max_images }}"
          echo
          echo "Running:"
          echo "python comic_factory_v4.py $ARGS"
          echo

          python comic_factory_v4.py $ARGS

      - name: Verify final video
        if: success()
        run: |
          test -f data/videos/latest.mp4

          echo
          echo "============================================================"
          echo "FINAL VIDEO"
          echo "============================================================"
          ls -lh data/videos/latest.mp4

      - name: Show checkpoint summary
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "CHECKPOINT RESULTS"
          echo "============================================================"

          if [ -f data/director/latest_checkpoints.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/director/latest_checkpoints.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          results = payload.get("results", [])

          passed = sum(
              1
              for item in results
              if item.get("passed") is True
          )

          failed = sum(
              1
              for item in results
              if item.get("passed") is False
          )

          print(f"Checkpoint PASS events : {passed}")
          print(f"Repair events          : {failed}")
          print()

          latest_by_name = {}

          for item in results:
              latest_by_name[item.get("name", "unknown")] = item

          for name, item in sorted(latest_by_name.items()):
              icon = "PASS" if item.get("passed") else "REPAIR"

              print(
                  f"{icon:6} | "
                  f"{name:45} | "
                  f"{item.get('score', 0):6.2f}/"
                  f"{item.get('threshold', 0):6.2f} | "
                  f"cycle {item.get('cycle', '?')}"
              )
          PY
          else
            echo "Checkpoint dosyası henüz oluşmadı."
          fi

      - name: Upload V4 quality package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-factory-v4-quality-test
          path: |
            data/videos/latest.mp4
            data/scripts/latest.json
            data/scripts/storyboard_v4.json
            data/audio/latest.wav
            data/audio/latest_word_timestamps.json
            data/audio/aligned_subtitle_words.json
            data/events/active_event.json
            data/director/latest_checkpoints.json
            data/director/quality_lessons.json
            data/video_work_v4/contact_sheet.jpg
            data/video_work_v4/precise.ass
            assets/comic_pages_v4/**/visual_manifest.json
          if-no-files-found: warn
          retention-days: 7
