# .github/workflows/thor-prototype.yml

name: Thor Prototype

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Görselleri sıfırdan yeniden topla"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WHISPER_MODEL: whisper-large-v3-turbo

      ENABLE_AI_RECONSTRUCTION: "0"

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Thor high-quality prototype
        shell: bash
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            python prototype_thor_galactus.py --rebuild
          else
            python prototype_thor_galactus.py
          fi

      - name: Upload prototype video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thor-galactus-prototype
          path: |
            data/prototype/thor_galactus_v1.mp4
            data/prototype/thor_galactus/storyboard.json
            data/prototype/thor_galactus/director_critique.json
            data/prototype/thor_galactus/contact_sheet.jpg
            data/prototype/thor_galactus/manifest.json
          if-no-files-found: warn
          retention-days: 7
