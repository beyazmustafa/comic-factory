# .github/workflows/thor-v2-prototype.yml

name: Thor V2 Prototype

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Görselleri sıfırdan yeniden topla"
        required: false
        default: true
        type: boolean

      ai_reconstruction:
        description: "Eksik sahnelerde AI reconstruction kullan"
        required: false
        default: false
        type: boolean

      edge_voice:
        description: "Gemini TTS yerine Edge TTS kullan"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: thor-v2-prototype
  cancel-in-progress: false

jobs:
  build-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Gacrux

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WHISPER_MODEL: whisper-large-v3-turbo

      EDGE_FALLBACK_VOICE: tr-TR-AhmetNeural

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Thor V2 prototype
        shell: bash
        run: |
          ARGS=""

          if [ "${{ inputs.rebuild }}" = "true" ]; then
            ARGS="$ARGS --rebuild"
          fi

          if [ "${{ inputs.ai_reconstruction }}" = "true" ]; then
            ARGS="$ARGS --enable-ai-reconstruction"
          fi

          if [ "${{ inputs.edge_voice }}" = "true" ]; then
            ARGS="$ARGS --edge-voice"
          fi

          echo "Running:"
          echo "python prototype_thor_galactus_v2.py $ARGS"

          python prototype_thor_galactus_v2.py $ARGS

      - name: Verify prototype video
        if: success()
        run: |
          test -f data/prototype/thor_galactus_v2.mp4

          ls -lh data/prototype/thor_galactus_v2.mp4

          echo "Thor V2 prototype hazır."

      - name: Upload Thor V2 prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thor-v2-prototype
          path: |
            data/prototype/thor_galactus_v2.mp4
            data/prototype/thor_galactus_v2/storyboard.json
            data/prototype/thor_galactus_v2/visual_plan.json
            data/prototype/thor_galactus_v2/director_critique.json
            data/prototype/thor_galactus_v2/voice_direction.json
            data/prototype/thor_galactus_v2/contact_sheet.jpg
            data/prototype/thor_galactus_v2/manifest.json
            data/prototype/thor_galactus_v2/lessons.json
          if-no-files-found: warn
          retention-days: 7
