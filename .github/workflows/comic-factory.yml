# .github/workflows/comic-factory.yml

name: Comic Factory

on:
  workflow_dispatch:

  schedule:
    - cron: "13 6 * * *"
    - cron: "13 14 * * *"

permissions:
  contents: read

concurrency:
  group: comic-factory-production
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6

      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Comic Factory state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/events/used_events.json
            data/youtube/upload_history.json
            data/instagram/upload_history.json
          key: comic-factory-state-${{ github.run_id }}
          restore-keys: |
            comic-factory-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("client_secret.json").write_bytes(
              base64.b64decode(
                  os.environ["YOUTUBE_CLIENT_SECRET_B64"]
              )
          )

          Path("token.json").write_bytes(
              base64.b64decode(
                  os.environ["YOUTUBE_TOKEN_B64"]
              )
          )

          print("YouTube credential dosyaları hazır.")
          PY

      - name: Create video and upload to YouTube
        run: |
          python comic_factory.py --upload

      - name: Upload video to Instagram Reels
        run: |
          python instagram_uploader.py

      - name: Save Comic Factory state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/events/used_events.json
            data/youtube/upload_history.json
            data/instagram/upload_history.json
          key: comic-factory-state-${{ github.run_id }}

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f client_secret.json token.json
