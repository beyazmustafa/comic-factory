name: Comic Factory Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.5-flash-lite
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_WHISPER_MODEL: whisper-large-v3-turbo
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
  CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore Comic Factory state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/
            youtube_credentials.json
          key: comic-factory-state-${{ github.run_id }}
          restore-keys: |
            comic-factory-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install imageio imageio-ffmpeg instagrapi cloudinary

      - name: Restore YouTube credentials
        run: echo "YouTube credential dosyaları hazır."

      - name: Create video and publish to YouTube
        run: python comic_factory.py --upload

      - name: Upload video to Instagram Reels
        run: python instagram_uploader.py

      - name: Save Comic Factory state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/
            youtube_credentials.json
          key: comic-factory-state-${{ github.run_id }}
