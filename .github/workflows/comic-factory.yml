name: Comic Factory Studio
'on':
  schedule:
    # Günde iki üretim + yükleme: 09:00 ve 18:00 Türkiye saati (UTC+3).
    # GitHub zamanlanmış koşuları yoğunlukta 10-30 dk geciktirebilir.
    - cron: '0 6,15 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: İşlem
        type: choice
        default: preview
        options:
        - preview
        - create_and_publish
        - publish_preview
        - voice_test
      topic:
        description: Konu — boşsa çizgi roman tarihinden otomatik seçilir
        type: string
        default: ''
      duration:
        description: Hedef süre, saniye (20–165)
        type: string
        default: '150'
      voice:
        description: Türkçe anlatıcı — auto üç sesi karşılaştırır
        type: choice
        default: auto
        options:
        - auto
        - Orus
        - Gacrux
        - Fenrir
        - Puck
        - Ahmet
        - Emel
      platforms:
        description: Yayın hedefi
        type: choice
        default: both
        options:
        - both
        - youtube
        - instagram
      resume_run_id:
        description: Yarım kalan bu sürümün sayısal run ID'si; yeni üretimde boş
        type: string
        default: ''
      preview_run_id:
        description: publish_preview için hazır videonun sayısal run ID'si
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: comic-factory-studio
  cancel-in-progress: false
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      # Zamanlanmış koşuda inputs boştur; varsayılanlar burada çözülür.
      TASK: ${{ inputs.task || 'create_and_publish' }}
      TOPIC: ${{ inputs.topic || '' }}
      DURATION: ${{ inputs.duration || '150' }}
      VOICE: ${{ inputs.voice || 'auto' }}
      PLATFORMS: ${{ inputs.platforms || vars.SCHEDULED_PLATFORMS || 'youtube' }}
      RESUME: ${{ inputs.resume_run_id || '' }}
      PREVIEW: ${{ inputs.preview_run_id || '' }}
      YOUTUBE_VISIBILITY: ${{ vars.YOUTUBE_VISIBILITY || 'unlisted' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      GOOGLE_CLIENT_SECRET_B64: ${{ secrets.GOOGLE_CLIENT_SECRET_B64 }}
      CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      YOUTUBE_CREDENTIALS_B64: ${{ secrets.YOUTUBE_CREDENTIALS_B64 }}
      TOKEN_B64: ${{ secrets.TOKEN_B64 }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      GROQ_WHISPER_MODEL: ${{ vars.GROQ_WHISPER_MODEL }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install media tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra poppler-utils p7zip-full
        python -m pip install -r requirements.txt
    - name: Restore history and successful audio
      uses: actions/cache/restore@v4
      with:
        path: |
          data/events/
          data/cache-v2/
          data/youtube/
          data/instagram/
          data/publishing/
        key: comic-factory-studio-v2-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          comic-factory-studio-v2-
          comic-factory-history-
          comic-factory-state-
    - name: Check code and setup
      run: |
        python -m unittest discover -s tests -v
        python comic_factory.py --check
    - name: Validate previous run
      id: previous
      run: |
        python - <<'PY'
        import os
        task=os.environ['TASK']
        resume,preview=os.environ['RESUME'].strip(),os.environ['PREVIEW'].strip()
        if resume and (task in ('publish_preview','voice_test') or preview):
            raise SystemExit('Devam ID değeri yalnız üretim için kullanılabilir.')
        value=preview if task=='publish_preview' else resume
        if task=='publish_preview' and not value:
            raise SystemExit('Hazır videonun preview_run_id değerini yaz.')
        if value and (not value.isdecimal() or int(value)<=0):
            raise SystemExit('Çalışma ID değeri pozitif tam sayı olmalı.')
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('run_id='+value+'\n')
        PY
    - name: Download saved work
      if: steps.previous.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: comic-preview-${{ steps.previous.outputs.run_id }}
        path: data/incoming
        github-token: ${{ github.token }}
        run-id: ${{ steps.previous.outputs.run_id }}
    - name: Produce or publish
      id: produce
      run: |
        mkdir -p data/logs
        python - <<'PY'
        import os,sys,subprocess
        from pathlib import Path
        task=os.environ['TASK']
        args=[sys.executable,'-u','comic_factory.py']
        if task=='publish_preview':
            args+=['--publish-run','data/incoming']
        else:
            args+=['--topic',os.environ['TOPIC'],'--duration',os.environ['DURATION'],'--voice',os.environ['VOICE']]
            if os.environ['RESUME'].strip(): args+=['--resume-run','data/incoming']
            if task=='voice_test': args+=['--voice-test']
            if task=='create_and_publish': args+=['--publish']
        args+=['--platforms',os.environ['PLATFORMS']]
        with Path('data/logs/studio.log').open('w',encoding='utf-8') as log:
            process=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,encoding='utf-8',errors='replace')
            for line in process.stdout:
                print(line,end='',flush=True)
                log.write(line);log.flush()
            raise SystemExit(process.wait())
        PY
    - name: Record used issues in the repository
      if: always()
      run: |
        git config user.name "comic-factory-bot"
        git config user.email "comic-factory-bot@users.noreply.github.com"
        mkdir -p data/logs
        {
          echo "run_id: ${{ github.run_id }}  attempt: ${{ github.run_attempt }}  event: ${{ github.event_name }}"
          echo "produce step outcome: ${{ steps.produce.outcome }}"
          for f in data/runs/*/run.json; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; echo; }; done
          for f in data/runs/*/diagnostics/provider_events.json data/runs/*/diagnostics/providers.json; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; echo; }; done
          for f in $(grep -l '"response_text"' data/runs/*/diagnostics/api_*.json 2>/dev/null | tail -n 3); do echo "--- $f"; head -c 2500 "$f"; echo; done
          for f in data/runs/*/audio/*/failures.json data/runs/*/voice_audition/failed_auditions.json; do [ -f "$f" ] && { echo "--- $f"; head -c 3000 "$f"; echo; }; done
          for f in data/runs/*/research/rejected_candidates.json; do [ -f "$f" ] && { echo "--- $f"; head -c 4000 "$f"; echo; }; done
          for f in $(ls data/runs/*/diagnostics/story_*.json data/runs/*/diagnostics/panel_matches_*.json 2>/dev/null | tail -n 4); do echo "--- $f"; python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d[k] for k in d if k in ('error','failures','passed')}, ensure_ascii=False)[:3000])" "$f"; done
          echo "--- studio.log (son 300 satır)"
          tail -n 300 data/logs/studio.log 2>/dev/null || echo "(log yok)"
        } > data/logs/last_run.txt
        # data/history is tracked; everything else under data/ is ignored, so a
        # hard reset to the remote branch only refreshes the history files.
        # The run may have updated tracked history files (playbook, performance,
        # experiments); keep a snapshot so the reset below cannot discard them.
        rm -rf data/logs/history_snapshot && mkdir -p data/logs/history_snapshot
        cp -r data/history/. data/logs/history_snapshot/ 2>/dev/null || true
        for attempt in 1 2 3 4; do
          git fetch origin "${{ github.ref_name }}"
          git reset -q --hard "origin/${{ github.ref_name }}"
          mkdir -p data/history
          cp -r data/logs/history_snapshot/. data/history/
          cp data/logs/last_run.txt data/history/last_run.txt
          git add -A data/history
          if git diff --cached --quiet; then echo "Kayıt değişmedi."; break; fi
          git commit -q -m "history: koşu kaydı (run ${{ github.run_id }}, ${{ steps.produce.outcome }})"
          if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
          echo "Push reddedildi, yeniden deneniyor ($attempt)"; sleep $((attempt * 8))
        done
    - name: Save video, sources, voices and resumable work
      if: always() && steps.produce.outputs.run_directory != ''
      uses: actions/upload-artifact@v4
      with:
        name: comic-preview-${{ github.run_id }}
        path: |
          ${{ steps.produce.outputs.run_directory }}/
          !${{ steps.produce.outputs.run_directory }}/render/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Save diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: comic-diagnostics-${{ github.run_id }}
        path: |
          data/logs/
          data/runs/*/run.json
          data/runs/*/diagnostics/
          data/publishing/
          data/incoming/publication.json
        if-no-files-found: warn
        retention-days: 14
    - name: Save history and successful audio
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          data/events/
          data/cache-v2/
          data/youtube/
          data/instagram/
          data/publishing/
        key: comic-factory-studio-v2-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Show result
      if: always()
      env:
        CURRENT_RUN: ${{ github.run_id }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        text='# Comic Factory Studio\n\n'
        text+='Önizleme artifact ZIP dosyasını çıkart ve review.html dosyasını aç. Video, ses örnekleri ve kaynaklar aynı yerde.\n\n'
        text+='Hazır videoyu yüklemek için publish_preview; yarım kalan üretim için preview ve resume_run_id kullan.\n\n'
        text+='Bu çalışmanın ID değeri: '+os.environ['CURRENT_RUN']+'\n'
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as output:
            output.write(text)
        PY
