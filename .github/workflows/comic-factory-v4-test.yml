# .github/workflows/comic-factory-v4-test.yml

name: Comic Factory V4 Quality Test

on:
  workflow_dispatch:
    inputs:
      reuse_active:
        description: "Mevcut active event'i tekrar kullan"
        required: false
        default: false
        type: boolean

      ai_reconstruction:
        description: "Eksik sahnelerde AI reconstruction kullan"
        required: false
        default: true
        type: boolean

      max_images:
        description: "Global comic görsel havuzu"
        required: false
        default: "40"
        type: string

      event_count:
        description: "Araştırılacak event aday sayısı"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

concurrency:
  group: comic-factory-v4-quality-test
  cancel-in-progress: false

jobs:
  comic-factory-v4:
    name: Run Comic Factory V4
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Gacrux
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image

      GROQ_WHISPER_MODEL: whisper-large-v3-turbo

      ENABLE_AI_RECONSTRUCTION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show environment
        run: |
          echo "============================================================"
          echo "COMIC FACTORY V4 ENVIRONMENT"
          echo "============================================================"
          python --version
          echo "Runner: $RUNNER_OS"
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Voice: Gacrux LOCKED"
          echo "AI reconstruction input: ${{ inputs.ai_reconstruction }}"
          echo "Max images: ${{ inputs.max_images }}"
          echo "Event count: ${{ inputs.event_count }}"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt bulunamadı."
            exit 1
          fi

          pip install -r requirements.txt

      - name: Verify required Python packages
        run: |
          python - <<'PY'
          import importlib

          packages = {
              "google.genai": "google-genai",
              "groq": "groq",
              "PIL": "Pillow",
              "requests": "requests",
              "ddgs": "ddgs",
              "dotenv": "python-dotenv",
              "imageio_ffmpeg": "imageio-ffmpeg",
          }

          missing = []

          for module, package in packages.items():
              try:
                  importlib.import_module(module)
                  print(f"✓ {package}")
              except Exception as error:
                  print(f"✗ {package}: {error}")
                  missing.append(package)

          if missing:
              raise SystemExit(
                  "Eksik paketler: " + ", ".join(missing)
              )
          PY

      - name: Verify secrets
        shell: bash
        run: |
          FAILED=0

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret bulunamadı."
            FAILED=1
          else
            echo "✓ GEMINI_API_KEY mevcut"
          fi

          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret bulunamadı."
            FAILED=1
          else
            echo "✓ GROQ_API_KEY mevcut"
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Verify Comic Factory V4 file
        run: |
          if [ ! -f comic_factory_v4.py ]; then
            echo "::error::comic_factory_v4.py bulunamadı."
            exit 1
          fi

          ls -lh comic_factory_v4.py

      - name: Python syntax check
        run: |
          python -m py_compile comic_factory_v4.py
          echo "✓ comic_factory_v4.py syntax OK"

      - name: Import smoke test
        run: |
          python - <<'PY'
          import comic_factory_v4

          print("✓ module import OK")
          print(
              "✓ Voice:",
              comic_factory_v4.GEMINI_TTS_VOICE,
          )

          if comic_factory_v4.GEMINI_TTS_VOICE != "Gacrux":
              raise SystemExit(
                  "Gacrux voice lock bozulmuş."
              )
          PY

      - name: Comic Factory runtime check
        run: |
          python comic_factory_v4.py --check

      - name: Prepare output directories
        run: |
          mkdir -p data/logs
          mkdir -p data/videos
          mkdir -p data/audio
          mkdir -p data/scripts
          mkdir -p data/director
          mkdir -p data/video_work_v4

      - name: Build V4 command
        id: command
        shell: bash
        run: |
          ARGS="--max-images ${{ inputs.max_images }}"
          ARGS="$ARGS --count ${{ inputs.event_count }}"

          if [ "${{ inputs.reuse_active }}" = "true" ]; then
            ARGS="$ARGS --reuse-active"
          fi

          if [ "${{ inputs.ai_reconstruction }}" != "true" ]; then
            ARGS="$ARGS --disable-ai-reconstruction"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

          echo "============================================================"
          echo "V4 COMMAND"
          echo "============================================================"
          echo "python comic_factory_v4.py $ARGS"

      - name: Run Comic Factory V4
        id: run_v4
        shell: bash
        run: |
          set -o pipefail

          LOG_FILE="data/logs/comic_factory_v4.log"

          echo "============================================================" | tee "$LOG_FILE"
          echo "COMIC FACTORY V4 QUALITY TEST" | tee -a "$LOG_FILE"
          echo "============================================================" | tee -a "$LOG_FILE"
          echo "Started: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" | tee -a "$LOG_FILE"
          echo "Voice: Gacrux LOCKED" | tee -a "$LOG_FILE"
          echo | tee -a "$LOG_FILE"

          python comic_factory_v4.py \
            ${{ steps.command.outputs.args }} \
            2>&1 | tee -a "$LOG_FILE"

          EXIT_CODE=${PIPESTATUS[0]}

          echo | tee -a "$LOG_FILE"
          echo "Finished: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" | tee -a "$LOG_FILE"
          echo "Exit code: $EXIT_CODE" | tee -a "$LOG_FILE"

          exit "$EXIT_CODE"

      - name: Verify final video
        if: success()
        shell: bash
        run: |
          VIDEO="data/videos/latest.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "::error::latest.mp4 oluşturulmadı."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::latest.mp4 şüpheli derecede küçük: $SIZE bytes"
            exit 1
          fi

          echo "============================================================"
          echo "FINAL VIDEO"
          echo "============================================================"
          ls -lh "$VIDEO"

      - name: Validate final media with FFmpeg
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path

          import imageio_ffmpeg

          video = Path("data/videos/latest.mp4")

          if not video.exists():
              raise SystemExit("latest.mp4 bulunamadı.")

          print("✓ Video file exists")
          print(f"✓ Size: {video.stat().st_size / 1024 / 1024:.2f} MB")
          print(f"✓ FFmpeg: {imageio_ffmpeg.get_ffmpeg_exe()}")
          PY

      - name: Show checkpoint summary
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "CHECKPOINT SUMMARY"
          echo "============================================================"

          if [ ! -f data/director/latest_checkpoints.json ]; then
            echo "Checkpoint dosyası henüz oluşmadı."
            exit 0
          fi

          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path(
              "data/director/latest_checkpoints.json"
          )

          payload = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          results = payload.get(
              "results",
              [],
          )

          print(
              f"Toplam checkpoint event: "
              f"{len(results)}"
          )

          passed = sum(
              1
              for item in results
              if item.get("passed") is True
          )

          repaired = sum(
              1
              for item in results
              if item.get("passed") is False
          )

          print(f"PASS events   : {passed}")
          print(f"Repair events : {repaired}")
          print()

          latest = {}

          for item in results:
              event_id = item.get(
                  "event_id",
                  "",
              )

              name = item.get(
                  "name",
                  "unknown",
              )

              latest[
                  (
                      event_id,
                      name,
                  )
              ] = item

          print(
              f"{'STATUS':<8} "
              f"{'CHECKPOINT':<46} "
              f"{'SCORE':>8} "
              f"{'MIN':>8} "
              f"{'CYCLE':>7}"
          )

          print("-" * 84)

          for (
              event_id,
              name,
          ), item in latest.items():
              status = (
                  "PASS"
                  if item.get(
                      "passed"
                  )
                  else "REPAIR"
              )

              print(
                  f"{status:<8} "
                  f"{name:<46} "
                  f"{float(item.get('score', 0)):>8.2f} "
                  f"{float(item.get('threshold', 0)):>8.2f} "
                  f"{str(item.get('cycle', '?')):>7}"
              )

          print()
          print("EVENT SUMMARY")
          print("-" * 84)

          grouped = defaultdict(
              lambda: {
                  "pass": 0,
                  "repair": 0,
              }
          )

          for item in results:
              event_id = (
                  item.get(
                      "event_id"
                  )
                  or "unknown"
              )

              if item.get(
                  "passed"
              ):
                  grouped[
                      event_id
                  ][
                      "pass"
                  ] += 1
              else:
                  grouped[
                      event_id
                  ][
                      "repair"
                  ] += 1

          for event_id, counts in grouped.items():
              print(
                  f"{event_id}: "
                  f"PASS={counts['pass']} "
                  f"REPAIR={counts['repair']}"
              )
          PY

      - name: Show rejected events
        if: always()
        run: |
          if [ -f data/director/rejected_events.json ]; then
            echo
            echo "============================================================"
            echo "REJECTED EVENTS"
            echo "============================================================"

            python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/director/rejected_events.json"
          )

          payload = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          events = payload.get(
              "events",
              [],
          )

          for event in events[-20:]:
              print()
              print(
                  "Event:",
                  event.get(
                      "event_title"
                  ),
              )
              print(
                  "Comic:",
                  event.get(
                      "series"
                  ),
                  event.get(
                      "issue"
                  ),
              )
              print(
                  "Reason:",
                  event.get(
                      "reason"
                  ),
              )
          PY
          else
            echo "Rejected event yok."
          fi

      - name: Show V4 log tail
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "LAST 150 LOG LINES"
          echo "============================================================"

          if [ -f data/logs/comic_factory_v4.log ]; then
            tail -n 150 data/logs/comic_factory_v4.log
          else
            echo "V4 log dosyası oluşmadı."
          fi

      - name: Upload final video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: comic-factory-v4-video
          path: |
            data/videos/latest.mp4
            data/scripts/latest.json
            data/scripts/storyboard_v4.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload V4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-factory-v4-diagnostics-${{ github.run_number }}
          path: |
            data/logs/comic_factory_v4.log
            data/director/latest_checkpoints.json
            data/director/quality_lessons.json
            data/director/rejected_events.json
            data/events/active_event.json
            data/research/*.json
            data/scripts/latest.json
            data/scripts/storyboard_v4.json
            data/audio/latest.wav
            data/audio/latest_word_timestamps.json
            data/audio/aligned_subtitle_words.json
            data/video_work_v4/precise.ass
            data/video_work_v4/contact_sheet.jpg
            assets/comic_pages_v4/**/visual_manifest.json
            data/videos/*.mp4
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
