name: Comic Factory Thor V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comic-factory-thor-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Gacrux
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      GROQ_WHISPER_MODEL: whisper-large-v3-turbo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile comic_factory.py
          python -m py_compile comic_factory_event_source.py

      - name: Runtime check
        run: |
          python comic_factory.py --check

      - name: Run Thor V2 Factory
        run: |
          python comic_factory.py --rebuild --enable-ai-reconstruction

      - name: Verify video
        run: |
          test -s data/videos/latest.mp4
          ls -lh data/videos/latest.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: thor-v2-factory-video
          path: |
            data/videos/latest.mp4
            data/scripts/latest.json
            data/events/active_event.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thor-v2-factory-diagnostics
          path: |
            data/prototype/**
            data/audio/**
            data/scripts/**
            data/events/**
          if-no-files-found: warn
          retention-days: 7
